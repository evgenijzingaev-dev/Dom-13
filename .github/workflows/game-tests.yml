name: Game regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute dialogue and save compatibility tests
        run: node --test tests/*.test.cjs
